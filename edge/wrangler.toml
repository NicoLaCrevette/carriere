name = "carriere-llm"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origine du jeu publié : seule autorisée à appeler la fonction.
ORIGINES = "https://nicolacrevette.github.io"
# Fournisseur compatible OpenAI. Groq par défaut (palier gratuit généreux).
LLM_BASE = "https://api.groq.com/openai/v1"
LLM_MODEL_COURANT = "llama-3.3-70b-versatile"
LLM_MODEL_PREMIUM = "llama-3.3-70b-versatile"

# La clé n'est PAS ici : elle vit dans un secret.
#   npx wrangler secret put LLM_API_KEY
